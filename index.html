/* ---------- 8. STATE MANAGEMENT ---------- */
const DEFAULT_STATE = {
  user: null, // { name, email, avatar, level, createdAt }
  lessonsCompleted: 0,
  vocabLearned: [],
  grammarCompleted: [],
  conversationsCompleted: [],
  listeningCompleted: [],
  readingCompleted: [],
  streak: 0,
  lastStudyDate: null,
  quizCorrect: 0,
  quizTotal: 0,
  achievements: [],
  savedWords: [],
  dailyGoal: 5,
  preferredAccent: 'en-US',
};

let state = loadState();

function loadState(){
  try{
    const saved = localStorage.getItem('englishpro_state');
    if(saved) return { ...DEFAULT_STATE, ...JSON.parse(saved) };
  }catch(e){}
  return { ...DEFAULT_STATE };
}
function saveState(){
  try{ localStorage.setItem('englishpro_state', JSON.stringify(state)); }catch(e){}
}
function updateState(patch){
  state = { ...state, ...patch };
  saveState();
  checkAchievements();
}
function checkAchievements(){
  ACHIEVEMENTS.forEach(a=>{
    if(!state.achievements.includes(a.id) && a.req(state)){
      state.achievements.push(a.id);
      saveState();
      showToast(`🏆 Nova conquista: ${a.name}!`, 'success');
    }
  });
}
function markStudyToday(){
  const today = new Date().toDateString();
  if(state.lastStudyDate === today) return;
  const yesterday = new Date(Date.now()-86400000).toDateString();
  const newStreak = state.lastStudyDate === yesterday ? state.streak+1 : 1;
  updateState({ lastStudyDate: today, streak: newStreak });
}

/* ---------- 9. TOASTS ---------- */
function showToast(message, type='info'){
  const colors = { success:'bg-emerald-500', error:'bg-rose-500', info:'bg-brand-500', warn:'bg-amber-500' };
  const el = document.createElement('div');
  el.className = `toast ${colors[type]} text-white px-4 py-3 rounded-xl shadow-lg font-medium pointer-events-auto max-w-sm`;
  el.textContent = message;
  document.getElementById('toasts').appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transform='translateX(20px)'; el.style.transition='all 0.3s'; }, 2800);
  setTimeout(()=> el.remove(), 3200);
}

/* ---------- 10. SPEECH SYNTHESIS (Text-to-Speech) ---------- */
function speak(text, lang=null){
  try{
    if(!('speechSynthesis' in window)){ showToast('Áudio não suportado neste navegador', 'warn'); return; }
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = lang || state.preferredAccent || 'en-US';
    utter.rate = 0.9;
    utter.pitch = 1;
    const voices = window.speechSynthesis.getVoices();
    const match = voices.find(v=>v.lang === utter.lang) || voices.find(v=>v.lang.startsWith('en'));
    if(match) utter.voice = match;
    window.speechSynthesis.speak(utter);
  }catch(e){ console.warn(e); }
}

function handleAuth(mode, form){
  const data = new FormData(form);
  const email = data.get('email');
  const name = data.get('name') || email.split('@')[0];
  const level = data.get('level') || 'A1';
  // Simple local "database" by email
  const usersKey = 'englishpro_users';
  const users = JSON.parse(localStorage.getItem(usersKey)||'{}');
  if(mode==='register'){
    if(users[email]){ showToast('Esse e-mail já está cadastrado', 'error'); return; }
    users[email] = { name, password:data.get('password'), level, createdAt:Date.now() };
    localStorage.setItem(usersKey, JSON.stringify(users));
    updateState({ user:{ name, email, level, createdAt:Date.now() }});
    showToast(`Bem-vindo(a), ${name}! 🎉`, 'success');
  } else {
    const u = users[email];
    if(!u || u.password !== data.get('password')){ showToast('E-mail ou senha incorretos', 'error'); return; }
    updateState({ user:{ name:u.name, email, level:u.level, createdAt:u.createdAt }});
    showToast(`Bem-vindo(a) de volta, ${u.name}!`, 'success');
  }
  navigate('dashboard');
}
function logout(){
  if(confirm('Deseja sair da sua conta? Seu progresso continuará salvo neste navegador.')){
    updateState({ user:null });
    navigate('home');
  }
}

function startSpeechRecognition(target){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const resultEl = document.getElementById('speech-result');
  if(!SR){ resultEl.innerHTML = '⚠️ Seu navegador não suporta reconhecimento de voz. Tente usar o Chrome no desktop ou Android.'; return; }
  const rec = new SR();
  rec.lang = state.preferredAccent || 'en-US';
  rec.interimResults = false;
  rec.maxAlternatives = 1;
  resultEl.innerHTML = '🎙️ Ouvindo... fale agora!';
  rec.onresult = (e)=>{
    const said = e.results[0][0].transcript;
    const score = similarity(said.toLowerCase(), target.toLowerCase());
    const pct = Math.round(score*100);
    const ok = pct>=70;
    resultEl.innerHTML = `
      <div class="mt-2 bg-white/10 backdrop-blur rounded-xl p-4">
        <div>Você disse: <strong>"${said}"</strong></div>
        <div class="mt-2">Similaridade: <strong class="text-xl">${pct}%</strong> ${ok?'✅ Ótimo!':'🎯 Tente novamente!'}</div>
      </div>`;
    if(ok){ state.lessonsCompleted+=1; markStudyToday(); saveState(); }
  };
  rec.onerror = ()=> resultEl.innerHTML = '❌ Não consegui ouvir. Verifique o microfone e tente novamente.';
  rec.start();
}
function similarity(a,b){
  const longer = a.length>b.length?a:b, shorter = a.length>b.length?b:a;
  if(longer.length===0) return 1;
  return (longer.length - editDistance(longer, shorter)) / longer.length;
}
function editDistance(a,b){
  const costs=[];
  for(let i=0;i<=a.length;i++){ let last=i;
    for(let j=0;j<=b.length;j++){
      if(i===0) costs[j]=j;
      else if(j>0){ let n=costs[j-1]; if(a.charAt(i-1)!==b.charAt(j-1)) n=Math.min(Math.min(n,last),costs[j])+1; costs[j-1]=last; last=n; }
    }
    if(i>0) costs[b.length]=last;
  }
  return costs[b.length];
}

      <button onclick="playConversation(${JSON.stringify(c.lines).replace(/"/g,'&quot;')})" class="flex-1 btn-primary py-3 rounded-xl">▶️ Reproduzir diálogo completo</button>
      <button onclick="completeConversation('${c.id}')" class="px-6 py-3 rounded-xl border border-slate-200 font-semibold hover:bg-slate-50">${state.conversationsCompleted.includes(c.id)?'✓ Concluído':'Marcar concluído'}</button>
    </div>
  </section>`;
}
function playConversation(lines){
  let i=0;
  const next = ()=>{
    if(i>=lines.length) return;
    const u = new SpeechSynthesisUtterance(lines[i].en);
    u.lang = state.preferredAccent || 'en-US';
    u.rate = 0.9;
    u.onend = ()=>{ i++; setTimeout(next, 500); };
    window.speechSynthesis.speak(u);
  };
  window.speechSynthesis.cancel();
  next();
}
function completeConversation(id){
  if(!state.conversationsCompleted.includes(id)){
    state.conversationsCompleted.push(id);
    state.lessonsCompleted +=1;
    markStudyToday(); saveState();
    showToast('Diálogo concluído! 💬', 'success');
  }
  render();
}

function submitListening(id, questions){
  const form = document.getElementById('listening-form');
  let correct = 0;
  questions.forEach((q,qi)=>{
    const val = parseInt(form[`q${qi}`].value);
    if(val===q.correct) correct++;
  });
  state.quizTotal += questions.length;
  state.quizCorrect += correct;
  if(!state.listeningCompleted.includes(id)){ state.listeningCompleted.push(id); state.lessonsCompleted+=1; }
  markStudyToday(); saveState();
  showToast(`Você acertou ${correct}/${questions.length}!`, correct===questions.length?'success':'info');
  render();
}

/* ---------- CHALLENGES ---------- */
let challengeState = null;
function pageChallenges(){
  return `
  <section class="max-w-5xl mx-auto px-6 py-10">
    <h1 class="font-display text-3xl md:text-4xl font-extrabold mb-2">Desafios Interativos</h1>
    <p class="text-slate-600 mb-8">Escolha um desafio e pratique de forma divertida.</p>
    <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-4">
      ${[
        { id:'image-to-word', title:'Imagem para Palavra', desc:'Identifique a palavra correta vendo a imagem.', emoji:'🖼️', color:'from-brand-500 to-purple-500' },
        { id:'word-to-pt', title:'Tradução PT → EN', desc:'Traduza palavras do português para o inglês.', emoji:'🔄', color:'from-emerald-500 to-teal-500' },
        { id:'fill-blank', title:'Complete a Frase', desc:'Preencha a lacuna corretamente.', emoji:'✏️', color:'from-accent-500 to-rose-500' },
        { id:'multiple-choice', title:'Quiz de Gramática', desc:'Perguntas variadas de todos os níveis.', emoji:'🧠', color:'from-sky-500 to-blue-500' },
        { id:'match-game', title:'Jogo de Associação', desc:'Combine palavras com suas traduções.', emoji:'🎴', color:'from-fuchsia-500 to-pink-500' },
        { id:'listen-choose', title:'Ouça e Escolha', desc:'Identifique a palavra ouvida.', emoji:'🎧', color:'from-amber-500 to-orange-500' },
      ].map(c=>`
        <button onclick="startChallenge('${c.id}')" class="card-hover text-left rounded-2xl p-5 text-white bg-gradient-to-br ${c.color}">
          <div class="text-4xl mb-3">${c.emoji}</div>
          <h3 class="font-display font-bold text-lg mb-1">${c.title}</h3>
          <p class="text-sm text-white/80">${c.desc}</p>
          <div class="mt-4 text-sm font-semibold">Começar →</div>
        </button>`).join('')}
    </div>
  </section>`;
}

function startChallenge(type){
  challengeState = { type, index:0, score:0, total:5, questions:generateQuestions(type,5) };
  navigate('challenge-play');
}
function generateQuestions(type, n){
  const qs = [];
  const shuffle = (arr)=> arr.slice().sort(()=>Math.random()-0.5);
  const pool = shuffle(VOCABULARY);
  for(let i=0;i<n;i++){
    const word = pool[i % pool.length];
    const others = shuffle(VOCABULARY.filter(v=>v.id!==word.id)).slice(0,3);
    if(type==='image-to-word'){
      const opts = shuffle([word, ...others]);
      qs.push({ kind:'choose', prompt:'Qual é esta palavra em inglês?', image:word.img, word:word.word, options:opts.map(o=>o.word), correct:opts.findIndex(o=>o.id===word.id) });
    } else if(type==='word-to-pt'){
      const opts = shuffle([word, ...others]);
      qs.push({ kind:'choose', prompt:`Como se diz "<strong>${word.pt}</strong>" em inglês?`, options:opts.map(o=>o.word), correct:opts.findIndex(o=>o.id===word.id) });
    } else if(type==='fill-blank'){
      const sentence = word.example.replace(new RegExp(word.word, 'i'), '____');
      const opts = shuffle([word, ...others]);
      qs.push({ kind:'choose', prompt:`Complete: <em>"${sentence}"</em>`, options:opts.map(o=>o.word), correct:opts.findIndex(o=>o.id===word.id) });
    } else if(type==='listen-choose'){
      const opts = shuffle([word, ...others]);
      qs.push({ kind:'listen', prompt:'Clique para ouvir e escolha a palavra:', listen:word.word, options:opts.map(o=>o.word), correct:opts.findIndex(o=>o.id===word.id) });
    } else if(type==='multiple-choice'){
      const extras = shuffle(EXTRA_QUIZZES);
      const q = extras[i % extras.length];
      qs.push({ kind:'choose', prompt:q.q, options:q.options, correct:q.correct });
    } else if(type==='match-game'){
      // simplified as choose
      const opts = shuffle([word, ...others]);
      qs.push({ kind:'choose', prompt:`Qual tradução combina com "<strong>${word.word}</strong>"?`, options:opts.map(o=>o.pt), correct:opts.findIndex(o=>o.id===word.id) });
    }
  }
  return qs;
}

function pageChallengePlay(){
  if(!challengeState) return pageChallenges();
  const s = challengeState;
  if(s.index >= s.total){
    const perfect = s.score === s.total;
    return `<section class="max-w-md mx-auto px-6 py-16 text-center">
      <div class="text-7xl mb-4">${perfect?'🏆':'🎉'}</div>
      <h1 class="font-display text-3xl font-extrabold mb-2">${perfect?'Perfeito!':'Bom trabalho!'}</h1>
      <p class="text-slate-600 mb-6">Você acertou <strong>${s.score} de ${s.total}</strong> perguntas.</p>
      <div class="w-full bg-slate-200 rounded-full h-3 mb-6 overflow-hidden"><div class="h-full gradient-brand" style="width:${(s.score/s.total)*100}%"></div></div>
      <div class="flex gap-3">
        <button onclick="startChallenge('${s.type}')" class="btn-primary flex-1 py-3 rounded-xl">Jogar de novo</button>
        <button onclick="navigate('challenges')" class="flex-1 py-3 rounded-xl border border-slate-200 font-semibold hover:bg-slate-50">Outros desafios</button>
      </div>
    </section>`;
  }
  const q = s.questions[s.index];
  return `
  <section class="max-w-2xl mx-auto px-6 py-10">
    <div class="mb-6">
      <div class="flex items-center justify-between text-sm font-semibold text-slate-600 mb-2">
        <span>Pergunta ${s.index+1} de ${s.total}</span>
        <span>Pontos: ${s.score}</span>
      </div>
      <div class="w-full bg-slate-200 rounded-full h-2 overflow-hidden"><div class="h-full gradient-brand transition-all" style="width:${((s.index)/s.total)*100}%"></div></div>
    </div>
    <div class="bg-white rounded-2xl p-6 border border-slate-200">
      ${q.image?`<img src="${q.image}" class="w-full h-56 object-cover rounded-xl mb-4" onerror="this.style.display='none'">`:''}
      ${q.listen?`<div class="text-center mb-4"><button onclick="speak('${q.listen}')" class="inline-flex items-center gap-2 px-6 py-4 bg-brand-500 text-white rounded-xl font-bold hover:bg-brand-600">${ICONS.speaker} Ouvir novamente</button></div>`:''}
      <div class="text-xl font-semibold mb-5">${q.prompt}</div>
      <div class="space-y-2" id="options">
        ${q.options.map((o,i)=>`<button onclick="answerChallenge(${i})" data-i="${i}" class="quiz-option w-full text-left px-4 py-3 rounded-xl font-medium">${o}</button>`).join('')}
      </div>
    </div>
  </section>`;
}
function answerChallenge(i){
  const s = challengeState;
  const q = s.questions[s.index];
  const buttons = document.querySelectorAll('#options .quiz-option');
  buttons.forEach(b=>b.classList.add('disabled'));
  const correct = q.correct;
  buttons[correct].classList.add('correct');
  if(i===correct){ s.score++; state.quizCorrect++; showToast('Correto! +10 XP', 'success'); }
  else{ buttons[i].classList.add('wrong'); showToast(`Resposta correta: ${q.options[correct]}`, 'error'); }
  state.quizTotal++;
  markStudyToday(); saveState();
  setTimeout(()=>{ s.index++; render(); }, 1400);
}

              ${['A1','A2','B1','B2','C1'].map(l=>`<option ${u.level===l?'selected':''} value="${l}">${l}</option>`).join('')}

              <option value="en-US" ${state.preferredAccent==='en-US'?'selected':''}>🇺🇸 Americano</option>
              <option value="en-GB" ${state.preferredAccent==='en-GB'?'selected':''}>🇬🇧 Britânico</option>
              <option value="en-AU" ${state.preferredAccent==='en-AU'?'selected':''}>🇦🇺 Australiano</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-semibold mb-1">Meta diária (palavras)</label>
            <input type="number" min="1" max="50" value="${state.dailyGoal}" onchange="updateState({dailyGoal:parseInt(this.value)})" class="w-full px-3 py-2 border border-slate-200 rounded-lg">

        <h3 class="font-display font-bold text-lg mb-4">Conquistas (${earned.length}/${ACHIEVEMENTS.length})</h3>
        <div class="grid grid-cols-3 gap-3">
          ${ACHIEVEMENTS.map(a=>{
            const got = state.achievements.includes(a.id);
            return `<div class="text-center p-3 rounded-xl ${got?'bg-gradient-to-br from-amber-50 to-orange-50 border border-amber-200':'bg-slate-50 opacity-50'}" title="${a.desc}">
              <div class="text-2xl mb-1">${a.icon}</div>
              <div class="text-[11px] font-semibold leading-tight">${a.name}</div>
            </div>`;
          }).join('')}
        </div>
      </div>
    </div>

    <div class="bg-white rounded-2xl p-6 border border-slate-200">
      <h3 class="font-display font-bold text-lg mb-4">⭐ Palavras salvas (${saved.length})</h3>
      ${saved.length?`<div class="grid sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">${saved.map(w=>`

          <img src="${w.img}" class="w-12 h-12 rounded-lg object-cover" loading="lazy" onerror="this.src='https://placehold.co/100/3b55f7/white?text=${encodeURIComponent(w.word[0])}'">

function updateUserField(field, value){
  state.user[field] = value;
  saveState(); showToast('Atualizado!', 'success');
}
function resetProgress(){
  if(!confirm('Tem certeza? Isso apagará TODO o seu progresso.')) return;
  const user = state.user;
  state = { ...DEFAULT_STATE, user };
  saveState(); render();
  showToast('Progresso resetado.', 'info');
}

/* ============================================================
   MAIN RENDER FUNCTION
   ============================================================ */
function render(params={}){
  const routes = {
    home: pageHome,
    about: pageAbout,
    login: ()=>pageAuth('login'),
    register: ()=>pageAuth('register'),
    dashboard: pageDashboard,
    daily: pageDaily,
    vocabulary: pageVocabulary,
    grammar: pageGrammar,
    'grammar-lesson': ()=>pageGrammarLesson(params),
    pronunciation: pagePronunciation,
    speaking: pageSpeaking,
    conversation: ()=>pageConversation(params),
    listening: pageListening,
    'listening-exercise': ()=>pageListeningExercise(params),
    reading: pageReading,
    'reading-text': ()=>pageReadingText(params),
    challenges: pageChallenges,
    'challenge-play': pageChallengePlay,
    profile: pageProfile,
  };
  const page = routes[currentRoute] || pageHome;
  document.getElementById('app').innerHTML = layout(page());
}

// Preload voices
if('speechSynthesis' in window){
  window.speechSynthesis.onvoiceschanged = ()=>{};
  window.speechSynthesis.getVoices();
}

// Initial render
render();
</script>
